<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="Styles/contact.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
     <link rel="icon" type="image/x-icon" href="Images/Logo.png">
</head>
<body>    

    <header>
   <div class="shop-tagline">  <h1>2D's Game Vault</h1>
<p class="description">Games to play and enjoy! <b>Buy now!</b></p>
</div>
    <nav>
    <ul>
    <li><a href="index.html">Home</a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="#">Contact</a></li>
  </ul>
 </nav>

</header>
<main>
<article>
    <form action="#" method="post">
    <fieldset>
      <legend>Your details</legend>

      <label for="name">Name</label>
      <input type="text" id="name" name="name" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>

      <label for="subject">Subject</label>
      <select id="subject" name="subject">
        <option value="product-question">Product question</option>
        <option value="order-status">Order status</option>
        <option value="wholesale-enquiry">Wholesale enquiry</option>
        <option value="something-else">Something else</option>
      </select>

      <label for="message">Message</label>
      <textarea id="message" name="message" placeholder="Write your message.." minlength="10" required></textarea>
    </fieldset>

    <button type="submit">Send message</button>

  </form>
</article>

</main>

<footer>
    <p>&copy; 2026 2D's Game Vault. All rights reserved.</p>
</footer>
</body>
</html>
